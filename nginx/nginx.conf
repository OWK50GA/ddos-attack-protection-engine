user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # JSON access log format
    # Every field required by the detector is included as a JSON key.
    # escape=json ensures special characters in URIs are properly escaped.
    # -----------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent'
        '}';

    access_log  /var/log/nginx/hng-access.log  json_combined;

    # -----------------------------------------------------------------------
    # Real IP — trust X-Forwarded-For from any upstream (CDN / load balancer)
    # -----------------------------------------------------------------------
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  0.0.0.0/0;

    sendfile        on;
    keepalive_timeout  65;

    # -----------------------------------------------------------------------
    # Upstream: Nextcloud container (service name in Docker Compose)
    # -----------------------------------------------------------------------
    upstream nextcloud {
        server nextcloud:80;
    }

    server {
        listen       80;
        server_name  _;

        # Proxy all traffic to Nextcloud
        location / {
            proxy_pass         http://nextcloud;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for Nextcloud large file uploads
            client_max_body_size  10G;
            proxy_request_buffering off;
        }
    }
}
